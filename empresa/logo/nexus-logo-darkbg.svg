<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="NEXUS">
  <title>NEXUS — monograma (fundo dark)</title>
  <defs>
    <linearGradient id="nexusGrad" gradientUnits="userSpaceOnUse" x1="300" y1="280" x2="760" y2="650">
      <stop offset="0" stop-color="#DFF7A0"/>
      <stop offset="0.45" stop-color="#5CE39A"/>
      <stop offset="1" stop-color="#00BFA5"/>
    </linearGradient>
    <filter id="nexusGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#0B1220"/>

  <g filter="url(#nexusGlow)" fill="url(#nexusGrad)">
    <rect x="429.5" y="230" width="165" height="470" rx="82" transform="rotate(-37 512 465)"/>
    <rect x="585" y="300" width="150" height="150" rx="34"/>
    <rect x="289" y="480" width="150" height="150" rx="34"/>
  </g>
</svg>
